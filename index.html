<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>PID Playground</title>
    <link rel="stylesheet" href="style.css" />
    <script src="js/playground.js"></script>
  </head>
  <body onload="main()">
    <main>
      <header>
        <h1>PID Playground</h1>
        <label class="system-picker">
          <span>System</span>
          <select id="system"></select>
        </label>
        <p id="system-description" class="subtitle">Loading…</p>
      </header>

      <section class="card pinned-card" aria-label="Picture of the system">
        <canvas id="diagram" role="img"
          aria-label="Animated picture of the system, showing what is measured and what the controller sets">
        </canvas>
        <div class="playback">
          <span id="playback-time" class="playback-time"></span>
          <button id="replay" type="button">Replay</button>
        </div>
      </section>

      <section class="card" aria-labelledby="chart-heading">
        <h2 id="chart-heading" class="visually-hidden">Step response</h2>
        <div class="legend" aria-hidden="true">
          <span><i class="swatch response"></i><span id="legend-output">Output</span></span>
          <span><i class="swatch setpoint"></i>Setpoint</span>
        </div>
        <canvas id="chart" role="img" aria-label="Step response chart of the output over time">
        </canvas>
      </section>

      <section class="card" aria-label="Response measurements">
        <p id="status" class="status" aria-live="polite">Loading the simulator…</p>
        <dl class="metrics">
          <div><dt>Overshoot</dt><dd id="overshoot">—</dd></div>
          <div><dt>Rise time</dt><dd id="rise-time">—</dd></div>
          <div><dt>Settling time</dt><dd id="settling-time">—</dd></div>
          <div><dt>Steady-state error</dt><dd id="steady-state-error">—</dd></div>
          <div class="wide">
            <dt id="peak-effort-label">Peak effort</dt>
            <dd id="peak-effort">—</dd>
            <p id="effort-note" class="effort-note"></p>
          </div>
        </dl>
      </section>

      <section class="card controls" aria-label="Controller gains">
        <label class="gain">
          <span class="gain-name">K<sub>p</sub> <small>proportional</small></span>
          <output id="kp-value" class="gain-value">—</output>
          <input id="kp" type="range" min="0" max="50" step="0.1" value="10" />
          <span id="kp-hint" class="hint"></span>
        </label>
        <label class="gain">
          <span class="gain-name">K<sub>i</sub> <small>integral</small></span>
          <output id="ki-value" class="gain-value">—</output>
          <input id="ki" type="range" min="0" max="30" step="0.1" value="0" />
          <span id="ki-hint" class="hint"></span>
        </label>
        <label class="gain">
          <span class="gain-name">K<sub>d</sub> <small>derivative</small></span>
          <output id="kd-value" class="gain-value">—</output>
          <input id="kd" type="range" min="0" max="15" step="0.1" value="0" />
          <span id="kd-hint" class="hint"></span>
        </label>
        <button id="reset" type="button">Reset gains</button>
      </section>

      <footer id="model-details"></footer>
    </main>
  </body>
</html>
